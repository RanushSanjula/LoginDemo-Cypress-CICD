name: Cypress Test Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Cypress
        run: npx cypress run

      - name: Merge Reports
        if: always()
        run: npx mochawesome-merge cypress/reports/*.json > cypress/reports/report.json

      - name: Generate HTML Report
        if: always()
        run: npx marge cypress/reports/report.json --reportDir cypress/reports/html --inline

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cypress-Test-Report
          path: cypress/reports/html

      - name: Send Email
        if: always()
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: node sendReport.js